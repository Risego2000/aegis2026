name: AEGIS · Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL pública del backend (vacío = variable AEGIS_API)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # Pages solo sirve ficheros: la URL debe quedar escrita en el artefacto,
      # no basta con una variable de compilación que se pueda quedar vacía.
      - name: Fijar la API pública en runtime-config.json
        working-directory: frontend
        env:
          AEGIS_API: ${{ github.event.inputs.api_url || vars.AEGIS_API }}
        run: node scripts/write-runtime-config.mjs

      # Pages puede publicar el cliente aunque el backend externo esté caído.
      # La comprobación informa del problema; health.yml sigue vigilándolo.
      - name: Comprobar la API pública
        working-directory: frontend
        run: |
          set -euo pipefail
          API=$(node -p "require('./public/runtime-config.json').api")
          echo "API configurada: $API"
          code=""
          code=$(curl -sSL -o /tmp/aegis-health.json -m 20 -w '%{http_code}' "${API}/api/health" || true)
          if [ "$code" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/aegis-health.json; then
            echo "La API responde en ${API}/api/health"
          else
            echo "::warning::La API ${API} no responde en /api/health (HTTP ${code:-sin respuesta}). Se publica el cliente, pero el mapa mostrará el aviso de API desconectada hasta configurar una URL estable en AEGIS_API."
          fi

      - name: Compilar el cliente
        working-directory: frontend
        env:
          NEXT_PUBLIC_AEGIS_API: ${{ github.event.inputs.api_url || vars.AEGIS_API }}
          # GitHub Pages publica en https://<usuario>.github.io/<repo>/
          NEXT_BASE_PATH: /aegis2026
        run: npm run build

      - name: Verificar el runtime-config del artefacto
        working-directory: frontend
        run: |
          set -euo pipefail
          API=$(node -p "require('./out/runtime-config.json').api")
          if [ -z "$API" ]; then
            echo "::error::out/runtime-config.json se quedó sin api; no se publica."
            exit 1
          fi
          echo "El artefacto apunta a $API"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
