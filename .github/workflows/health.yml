name: AEGIS · salud de lo publicado

# El mapa de GitHub Pages no lleva backend dentro: el workflow AEGIS · Pages
# escribe la URL de AEGIS_API en runtime-config.json. Este vigilante comprueba
# cada 30 minutos que el fichero publicado no está vacío y que la API a la que
# apunta responde de verdad. Así una URL muerta se ve en Actions y no se
# descubre al abrir el mapa.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: API publicada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la API del runtime-config publicado
        run: |
          set -euo pipefail
          CONFIG=$(curl -fsSL -m 20 -H "Cache-Control: no-cache" \
            "https://risego2000.github.io/aegis2026/runtime-config.json?ts=$(date +%s)")
          printf '%s\n' "$CONFIG"
          SITE_API=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("api", ""))')
          if [ -z "$SITE_API" ]; then
            echo "::error::runtime-config.json del sitio está vacío: el mapa cargará el fondo pero no pedirá datos. Relanza AEGIS · Pages con una AEGIS_API viva."
            exit 1
          fi
          echo "API del sitio publicado: $SITE_API"
          echo "SITE_API=$SITE_API" >> "$GITHUB_ENV"

      - name: Probar la API que usa el sitio
        run: |
          set -euo pipefail
          BASE="$SITE_API" python3 scripts/smoke.py
