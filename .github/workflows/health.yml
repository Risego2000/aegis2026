name: AEGIS · salud de lo publicado

# El mapa de GitHub Pages no lleva backend dentro: apunta a la URL de la
# variable AEGIS_API. Si esa URL muere (los túneles gratuitos cambian de
# subdominio al reconectar), el sitio sigue "publicado" pero sin datos. Este
# vigilante lo detecta cada 30 minutos en vez de esperar a que alguien mire.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: API publicada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar la API que usa el sitio
        env:
          BASE: ${{ vars.AEGIS_API }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::error::Falta la variable AEGIS_API (Settings → Secrets and variables → Actions → Variables). Sin ella el mapa publicado no puede pedir datos."
            exit 1
          fi
          echo "Comprobando $BASE"
          python3 scripts/smoke.py
