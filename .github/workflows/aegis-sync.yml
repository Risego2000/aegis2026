name: AEGIS temporary sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared commit and remove temporary files
        run: |
          set -euo pipefail
          printf '%s  %s\n' '3f2ed22d3f0ae30b8f527652e28b32629822b1835d54863f1f9a9836723d413a' '.github/aegis-sync.patch.gz' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gzip -dc .github/aegis-sync.patch.gz | git am --3way
          git rm .github/aegis-sync.patch.gz .github/workflows/aegis-sync.yml
          git commit -m 'Remove temporary sync files'
          git push origin HEAD:main
