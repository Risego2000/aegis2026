# Render Free: URL HTTPS estable sin disco persistente.
#
# En el panel de Render: New → Blueprint → conecta este repo. Render lee este
# fichero y construye el Dockerfile. SQLite se reinicia al dormir o redesplegar.
services:
  - type: web
    name: aegis-osint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SQLITE_PATH
        value: /tmp/aegis.sqlite
      - key: FRONTEND_DIR
        value: /app/frontend/out
      - key: RETENTION_DAYS
        value: "7"
      - key: PLAYBACK_ENABLED
        value: "true"
      - key: TLP
        value: CLEAR
