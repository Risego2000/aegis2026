# Render: alternativa sin CLI, con disco persistente para SQLite.
#
# En el panel de Render: New → Blueprint → conecta este repo. Render lee este
# fichero, construye el Dockerfile y monta el disco en /data.
services:
  - type: web
    name: aegis-osint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter              # el plan free no admite discos persistentes
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: aegis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SQLITE_PATH
        value: /data/aegis.sqlite
      - key: FRONTEND_DIR
        value: /app/frontend/out
      - key: RETENTION_DAYS
        value: "7"
      - key: PLAYBACK_ENABLED
        value: "true"
      - key: TLP
        value: CLEAR
      # Claves opcionales: se marcan `sync: false` para ponerlas en el panel.
      - key: AISSTREAM_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
